<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediPal - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">
    
    <!-- Sidebar -->
    <aside class="w-64 bg-blue-800 text-white flex flex-col">
        <div class="p-6 text-2xl font-bold border-b border-blue-700">MediPal</div>
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <button onclick="navigate('dashboard')" class="w-full text-left p-3 rounded hover:bg-blue-700 font-medium transition">Dashboard</button>
            <button onclick="navigate('medicines')" class="w-full text-left p-3 rounded hover:bg-blue-700 font-medium transition">Medicines</button>
            <button onclick="navigate('calendar')" class="w-full text-left p-3 rounded hover:bg-blue-700 font-medium transition">Calendar</button>
            <button onclick="navigate('appointments')" class="w-full text-left p-3 rounded hover:bg-blue-700 font-medium transition">Appointments</button>
            <button onclick="navigate('reports')" class="w-full text-left p-3 rounded hover:bg-blue-700 font-medium transition">Reports</button>
        </nav>
        <div class="p-4 border-t border-blue-700">
            <button onclick="logout()" class="w-full text-left p-3 rounded hover:bg-red-600 font-medium transition">Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- Top header -->
        <header class="bg-white shadow p-4 flex justify-between items-center">
            <h2 id="pageTitle" class="text-xl font-bold text-gray-800">Dashboard</h2>
            <div id="userInfo" class="text-gray-600 font-medium"></div>
        </header>

        <!-- Dynamic View Container -->
        <div class="p-6 flex-1 overflow-y-auto" id="app-view">
            <!-- Content injected here -->
        </div>
    </main>

    <script src="/app.js"></script>
</body>
</html>
